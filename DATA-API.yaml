# DATA-API.yaml — техническая карточка для автоматической проверки решения,
# согласно требованиям раздела "Формат сдачи" брифа хакатона.
schemaVersion: "2.0"
solution:
  name: "AskVUZ"
  teamId: "REPLACE_WITH_TEAM_ID"
baseUrl: "http://localhost:4000"

checks:
  - name: "Проверка доступности сервиса"
    method: GET
    path: /health
    role: anonymous
    expectedStatusCodes: [200]

  - name: "Список подключённых вузов"
    method: GET
    path: /api/universities
    role: anonymous
    expectedStatusCodes: [200]
    expectedResponse:
      contentType: application/json
      schema: "array<University>"

  - name: "Вход студента по имени (MVP-идентификация)"
    method: POST
    path: /api/student/login
    role: anonymous
    body:
      displayName: string
    expectedStatusCodes: [201]
    expectedResponse:
      contentType: application/json
      schema:
        token: string
        student: object

  - name: "Старт визарда «Задать вопрос»"
    method: POST
    path: /api/student/ask/start
    role: student
    auth: bearer
    body:
      wizardId: string
    expectedStatusCodes: [200]

  - name: "Отправка текста вопроса (создание вопроса)"
    method: POST
    path: /api/student/ask/message
    role: student
    auth: bearer
    body:
      wizardId: string
      text: string
    expectedStatusCodes: [200]
    expectedResponse:
      contentType: application/json
      schema:
        text: string
        questionId: string

  - name: "Мои вопросы — история вопросов студента"
    method: GET
    path: /api/student/questions
    role: student
    auth: bearer
    expectedStatusCodes: [200]
    expectedResponse:
      contentType: application/json
      schema: "array<StudentQuestionSummary>"

  - name: "Студент продолжает диалог (уточняющий вопрос)"
    method: POST
    path: /api/student/questions/{id}/messages
    role: student
    auth: bearer
    parameters:
      path:
        - name: id
          required: true
          type: string
    body:
      text: string
    expectedStatusCodes: [201, 404, 409]

  - name: "Студент оценивает ответ (начисление ауры)"
    method: POST
    path: /api/student/questions/{id}/rate
    role: student
    auth: bearer
    parameters:
      path:
        - name: id
          required: true
          type: string
    body:
      rating: "HELPFUL | NOT_HELPFUL | RESOLVED"
    expectedStatusCodes: [200, 404, 409]

  - name: "Студент закрывает вопрос"
    method: POST
    path: /api/student/questions/{id}/close
    role: student
    auth: bearer
    parameters:
      path:
        - name: id
          required: true
          type: string
    expectedStatusCodes: [200, 404]

  - name: "Авторизация эксперта/администратора"
    method: POST
    path: /api/auth/login
    role: anonymous
    body:
      email: string
      password: string
    expectedStatusCodes: [200, 401]
    expectedResponse:
      contentType: application/json
      schema:
        token: string
        user: object

  - name: "Очередь эксперта (новые + свои вопросы в работе)"
    method: GET
    path: /api/questions/queue
    role: expert
    auth: bearer
    expectedStatusCodes: [200, 403]
    expectedResponse:
      contentType: application/json
      schema:
        unclaimed: "array<Question>"
        mine: "array<Question>"

  - name: "Эксперт берёт вопрос в работу (не удаляет его, а переводит в тред)"
    method: POST
    path: /api/questions/{id}/claim
    role: expert
    auth: bearer
    parameters:
      path:
        - name: id
          required: true
          type: string
    expectedStatusCodes: [200, 403, 404, 409]

  - name: "Эксперт отвечает / продолжает диалог"
    method: POST
    path: /api/questions/{id}/messages
    role: expert
    auth: bearer
    parameters:
      path:
        - name: id
          required: true
          type: string
    body:
      text: string
    expectedStatusCodes: [201, 403, 404, 409]

  - name: "Публичный рейтинг экспертов вуза по ауре"
    method: GET
    path: /api/universities/{universityId}/leaderboard
    role: anonymous
    parameters:
      path:
        - name: universityId
          required: true
          type: string
    expectedStatusCodes: [200]
    expectedResponse:
      contentType: application/json
      schema: "array<LeaderboardEntry>"

notes: >
  Полная спецификация со схемами запросов/ответов — в openapi.yaml (OpenAPI 3.0)
  в корне репозитория. Тестовые учётные записи и пароли для роли "expert" —
  в README.md, раздел "Тестовые учётные записи". Файл базы данных (SQLite) —
  backend/data/askvuz.db, см. README, раздел "Где хранятся данные".
