openapi: 3.0.3
info:
  title: AskVUZ API
  description: >
    REST API for AskVUZ — a real-time threaded Q&A service for MAX that
    connects university organizations with students, and routes questions to
    verified answerers by role and aura (reputation).
  version: "2.0.0"
servers:
  - url: http://localhost:4000
    description: Local / docker-compose
paths:
  /health:
    get:
      summary: Liveness/health check
      responses:
        "200":
          description: OK

  /api/auth/login:
    post:
      summary: Staff (expert / university admin / platform admin) login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 4 }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/StaffUser" }
        "401":
          description: Invalid credentials

  /api/auth/whoami:
    get:
      summary: Resolve the current token — works for both a staff and a student token
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK

  /api/student/login:
    post:
      summary: Student "login" by display name only (MVP identity — see README)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  student: { type: object, properties: { id: { type: string }, displayName: { type: string } } }

  /api/student/ask/start:
    post:
      summary: Start (or restart) the "выбор вуза → категория → вопрос" wizard
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [wizardId]
              properties: { wizardId: { type: string } }
      responses:
        "200": { description: OK }

  /api/student/ask/click:
    post:
      summary: Wizard button click (select university / category)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [wizardId, buttonId]
              properties: { wizardId: { type: string }, buttonId: { type: string } }
      responses:
        "200": { description: OK }

  /api/student/ask/message:
    post:
      summary: Wizard free-text step — submits the question text, creating a Question
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [wizardId, text]
              properties: { wizardId: { type: string }, text: { type: string } }
      responses:
        "200": { description: OK }

  /api/student/questions:
    get:
      summary: "Мои вопросы — every question this student has asked"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentQuestionSummary" }

  /api/student/questions/{id}:
    get:
      summary: Full thread for one of the student's own questions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      responses:
        "200": { description: OK }
        "404": { description: Not found / not the owner }

  /api/student/questions/{id}/messages:
    post:
      summary: Student sends a follow-up message (continues the dialog with the responder)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "201": { description: Created }
        "409": { description: Question is closed }

  /api/student/questions/{id}/close:
    post:
      summary: Student closes a question they no longer need
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      responses:
        "200": { description: OK }

  /api/student/questions/{id}/rate:
    post:
      summary: Student rates the answer — drives the responder's aura
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties: { rating: { type: string, enum: [HELPFUL, NOT_HELPFUL, RESOLVED] } }
      responses:
        "200": { description: OK }
        "409": { description: No responder yet / already rated }

  /api/universities:
    get:
      summary: List active universities connected to the service
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/University" }
    post:
      summary: Onboard a new university (platform admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
                city: { type: string }
                description: { type: string }
      responses:
        "201": { description: Created }

  /api/universities/{universityId}/categories:
    get:
      summary: List question categories for a university
      parameters: [{ $ref: "#/components/parameters/UniversityIdPath" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      summary: Create a category (university admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UniversityIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201": { description: Created }

  /api/universities/{universityId}/leaderboard:
    get:
      summary: Public aura leaderboard for a university (visible to students too, no login required)
      parameters: [{ $ref: "#/components/parameters/UniversityIdPath" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardEntry" }

  /api/questions/queue:
    get:
      summary: "The logged-in expert's worklist: unclaimed eligible questions + everything already assigned to them"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unclaimed: { type: array, items: { $ref: "#/components/schemas/Question" } }
                  mine: { type: array, items: { $ref: "#/components/schemas/Question" } }

  /api/questions/{id}:
    get:
      summary: Get a question with its full message thread (staff)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      responses:
        "200": { description: OK }

  /api/questions/{id}/claim:
    post:
      summary: Claim an open question — moves it into the expert's "В работе" list, does not remove it
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      responses:
        "200": { description: Claimed }
        "409": { description: Already claimed }

  /api/questions/{id}/messages:
    post:
      summary: Expert sends a message — first one answers the question, later ones continue the dialog
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "201": { description: Created }

  /api/admin/universities/{universityId}/experts:
    get:
      summary: List a university's answerers (university admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UniversityIdPath" }]
      responses:
        "200": { description: OK }
    post:
      summary: Invite a new verified answerer (university admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UniversityIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email]
              properties:
                displayName: { type: string }
                email: { type: string, format: email }
                isStaff: { type: boolean }
                startingRole: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Created }

  /webhook/max:
    post:
      summary: MAX Bot API webhook receiver (see README for registration)
      responses:
        "200":
          description: Always acknowledged immediately; processed asynchronously

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UniversityIdPath:
      name: universityId
      in: path
      required: true
      schema: { type: string }
    QuestionId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Role:
      type: string
      enum: [HELPER, KNOWER, PRO]
    StaffUser:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        aura: { type: integer }
        isAnswerer: { type: boolean }
        isUniversityAdmin: { type: boolean }
        isPlatformAdmin: { type: boolean }
        isStaff: { type: boolean }
        universityId: { type: string, nullable: true }
    University:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        city: { type: string, nullable: true }
        description: { type: string, nullable: true }
    CategoryInput:
      type: object
      required: [code, title]
      properties:
        code: { type: string }
        title: { type: string }
        description: { type: string }
        minRole: { $ref: "#/components/schemas/Role" }
        isSensitive: { type: boolean }
        sortOrder: { type: integer }
    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryInput"
        - type: object
          properties:
            id: { type: string }
            universityId: { type: string }
    Question:
      type: object
      properties:
        id: { type: string }
        universityId: { type: string }
        categoryId: { type: string }
        text: { type: string }
        status: { type: string, enum: [PENDING, ROUTED, ANSWERED, ESCALATED, CLOSED] }
        isSensitive: { type: boolean }
        studentName: { type: string }
        createdAt: { type: string, format: date-time }
    StudentQuestionSummary:
      allOf:
        - $ref: "#/components/schemas/Question"
        - type: object
          properties:
            askerRating: { type: string, enum: [HELPFUL, NOT_HELPFUL, RESOLVED], nullable: true }
            lastMessagePreview: { type: string, nullable: true }
    LeaderboardEntry:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        roleLabel: { type: string }
        aura: { type: integer }
        isOnline: { type: boolean }
        answersCount: { type: integer }
